name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt · clippy · lint · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask eol
      - run: cargo xtask fmt
      - run: cargo xtask clippy
      - run: cargo xtask lint
      - run: cargo xtask test

  cross:
    name: cross-build for X51v (ARMv5TE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask cross

  emulator:
    name: boot in x51v emulator
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libslirp0 libpixman-1-0 libsndio7.0
      - run: cargo xtask emu

  bench:
    name: benchmarks (deterministic, vs baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install emulator runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libsdl2-2.0-0 libslirp0 libpixman-1-0 libsndio7.0
      - run: cargo xtask bench

  coverage:
    name: coverage (80% line floor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo xtask coverage
