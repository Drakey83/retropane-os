name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: dropdown
    id: where
    attributes:
      label: Where did it happen?
      options: [Real X51v (SD boot), Real X51v (flashed), Emulator, Host tests/tooling]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: RetroPane version / commit
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations: { required: true }
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Crash screen photo, USB console log or SD log
      render: text
