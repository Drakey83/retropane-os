[package]
name = "rp-port-hello"
description = "The first C program on RetroPane (docs/design/half-life-readiness.md lines 2 and 3): a C self-check built by the pinned Clang against picolibc, run in the emulator by `cargo xtask emu-chello`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Built only by `cargo xtask` with the C toolchain (xtask/src/cc.rs): the
# everyday builds (`cross`, `ci`) need no C compiler.
c = []

[[bin]]
name = "rp-port-hello"
path = "src/main.rs"
required-features = ["c"]

[target.'cfg(target_os = "none")'.dependencies]
rp-image = { path = "../../boot/image" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-cabi = { path = "../../hal/cabi" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-hal-api = { path = "../../hal/api" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-sdcard = { path = "../../drivers/sdcard" }
rp-drv-pxa-mmc = { path = "../../drivers/pxa-mmc" }
rp-fat = { path = "../../kernel/fat" }
rp-port = { path = "../sys" }
rp-audio-x51v = { path = "../../services/audio-x51v" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-wm8750 = { path = "../../drivers/wm8750" }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }
rp-drv-pxa-ssp = { path = "../../drivers/pxa-ssp" }
rp-drv-tsc2046 = { path = "../../drivers/tsc2046" }
rp-touch-cal = { path = "../../drivers/touch-cal" }

[lints]
workspace = true
