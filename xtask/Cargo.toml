[package]
name = "xtask"
description = "RetroPane build orchestration: `cargo xtask <command>`"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-weather = { path = "../shell/weather" }
serde_json = "1"
rp-drv-mbx-display = { path = "../drivers/mbx-display" }
rp-drv-mbx3d = { path = "../drivers/mbx3d" }
rp-draw = { path = "../drivers/draw" }
rp-gfx = { path = "../drivers/gfx" }
rp-shell = { path = "../shell/core" }
rp-today = { path = "../shell/today" }
rp-display-cal = { path = "../boot/display-cal" }
rp-looks = { path = "../boot/looks" }
rp-screen-measure = { path = "../boot/screen-measure" }
rp-mbx-render = { path = "../drivers/mbx-render", features = ["model"] }
rp-loadproto = { path = "../boot/loadproto", features = ["std"] }
rp-usb-mtp = { path = "../drivers/usb-mtp" }
rp-fat = { path = "../kernel/fat", features = ["std"] }
rp-hal-x51v = { path = "../hal/x51v" }
rp-hal-api = { path = "../hal/api" }
rp-crypto = { path = "../kernel/crypto" }
rp-kernel-pe = { path = "../kernel/pe" }
rp-kernel-trace = { path = "../kernel/trace" }
rp-hal-pxa27x = { path = "../hal/pxa27x" }

[lints]
workspace = true
