[package]
name = "rp-mbx3d-render"
description = "RetroPane's own MBX 3D renderer (ADR-0026): a retained scene of quads, only changed tiles rendered, straight into a rectangle of the screen picture, register shadow with diff-only writes, timer waits and recovery; host-tested against a model of the 3D core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# A model of the 3D core (the behaviour measured on the X51v, rp-mbx3d
# versions 3-23), for tests here and in images' host tests: needs std.
model = []

[dependencies]
rp-hal-api = { path = "../../hal/api" }
rp-drv-blit2d = { path = "../blit2d" }
rp-drv-mbx3d = { path = "../mbx3d" }
rp-drv-mbx-display = { path = "../mbx-display" }
rp-vram-map = { path = "../vram-map" }

[lints]
workspace = true

[dev-dependencies]
rp-hal-mock = { path = "../../hal/mock" }
