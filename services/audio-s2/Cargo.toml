[package]
name = "rp-audio-s2"
description = "Audio service step S2 on the real X51v (ADR-0032): the mixer, several streams at once from several rates, the long ring rewritten ahead for clicks, the adaptive wake interval, the limiter and the speaker filter, each measured and listened to"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-image = { path = "../../boot/image" }
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-simd = { path = "../../hal/simd" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-i2s = { path = "../../drivers/pxa-i2s" }
rp-drv-wm8750 = { path = "../../drivers/wm8750" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-pxa-ssp = { path = "../../drivers/pxa-ssp" }
rp-drv-tsc2046 = { path = "../../drivers/tsc2046" }
rp-audio = { path = "../../services/audio" }
rp-audio-x51v = { path = "../../services/audio-x51v" }

[lints]
workspace = true
