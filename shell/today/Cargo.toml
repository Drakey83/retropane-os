[package]
name = "rp-today"
description = "Test image (ADR-0021, ADR-0023): the shell's Today screen on the X51v under the loader: rp-shell drawn by the MBX 2D renderer over the wallpaper into an opaque 32 bpp picture, touch and buttons, and the touch-to-screen latency in the run log"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-hal-mem = { path = "../../hal/mem" }
rp-draw = { path = "../../drivers/draw" }
rp-shell = { path = "../core" }
rp-weather = { path = "../weather" }
# Also on the host: the emulator check builds its reference screen with
# the same set-up code (`show`).
rp-hal-api = { path = "../../hal/api" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-gfx = { path = "../../drivers/gfx" }
rp-touch-cal = { path = "../../drivers/touch-cal" }
rp-mbx-render = { path = "../../drivers/mbx-render" }
rp-drv-blit2d = { path = "../../drivers/blit2d" }
rp-inflate = { path = "../../kernel/inflate" }
# The radar map kept on the card (R184 step 3, `kept`): also on the host,
# where its tests write and read a card image.
rp-fat = { path = "../../kernel/fat" }

[build-dependencies]
rp-draw = { path = "../../drivers/draw" }
rp-inflate = { path = "../../kernel/inflate", features = ["pack"] }

[dev-dependencies]
rp-inflate = { path = "../../kernel/inflate", features = ["pack"] }
rp-fat = { path = "../../kernel/fat", features = ["std"] }
rp-mbx-render = { path = "../../drivers/mbx-render", features = ["model"] }

[target.'cfg(target_os = "none")'.dependencies]
rp-image = { path = "../../boot/image" }
rp-graphics = { path = "../../services/graphics" }
rp-mbx3d-render = { path = "../../drivers/mbx3d-render" }
rp-vram-map = { path = "../../drivers/vram-map" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-ssp = { path = "../../drivers/pxa-ssp" }
rp-drv-tsc2046 = { path = "../../drivers/tsc2046" }
rp-drv-pxa-udc = { path = "../../drivers/pxa-udc" }
rp-drv-pxa-mmc = { path = "../../drivers/pxa-mmc" }
rp-drv-sdcard = { path = "../../drivers/sdcard" }
rp-drv-cf = { path = "../../drivers/cf" }

[lints]
workspace = true
