[package]
name = "rp-hal-pxa27x"
description = "RetroPane HAL implementation for the Intel PXA27x SoC (real MMIO)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-hal-api = { path = "../api" }

# Bare-metal images link RetroPane's memcpy family; the media unit's dot
# product lives in rp-hal-simd (re-exported as iwmmxt::dot).
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-mem = { path = "../mem" }
rp-hal-simd = { path = "../simd" }

[dev-dependencies]
rp-hal-mock = { path = "../mock" }

[lints]
workspace = true
