[package]
name = "rp-bench"
description = "Benchmark image: micro-benchmarks timed with the PXA27x OS timer (cargo xtask bench)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the device build uses these; on the host this is an empty program.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-sdcard = { path = "../../drivers/sdcard" }
rp-drv-pxa-mmc = { path = "../../drivers/pxa-mmc" }
rp-kernel-mm = { path = "../../kernel/mm" }

[lints]
workspace = true
