[package]
name = "rp-mbx-blend"
description = "Test image (renderer step 1, ADR-0022): what the MBX 2D engine's blend state does (Dell's anti-aliased text reproduced, the blend word swept, ARGB sources, translucent fills) and what the display's interrupt events mean (HBLNK/VEVENT, the VEVENT line moved, DINTRCNT)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

