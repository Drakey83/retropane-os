[package]
name = "rp-hello"
description = "Bring-up image: proves the toolchain, startup code and UART on the emulator and the real X51v"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Only the device build uses these; on the host this is an empty program.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-ssp = { path = "../../drivers/pxa-ssp" }
rp-drv-tsc2046 = { path = "../../drivers/tsc2046" }

[lints]
workspace = true
