[package]
name = "rp-noise"
description = "Test image (ADR-0029): the device RNG's noise sources measured: the clocks' set-up, two-crystal and one-clock jitter, the TSC2046's battery, temperature and spare inputs; raw samples to the card for NIST SP 800-90B's tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-hal-mem = { path = "../../hal/mem" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-ssp = { path = "../../drivers/pxa-ssp" }
rp-drv-tsc2046 = { path = "../../drivers/tsc2046" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-sdcard = { path = "../../drivers/sdcard" }
rp-drv-pxa-mmc = { path = "../../drivers/pxa-mmc" }
rp-fat = { path = "../../kernel/fat" }

[lints]
workspace = true
