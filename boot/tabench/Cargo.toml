[package]
name = "rp-tabench"
description = "Test image (the performance gate's P4): the 2700G's tile accelerator against RetroPane's CPU binner at 100 / 1,000 / 5,000 textured quads of 16 x 16 and 64 x 64, fed Dell's way, with state once, as one triangle list and by DMA; CPU, TA and render times, words, the FIFO's level, pictures checked"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]

[target.'cfg(target_os = "none")'.dependencies]
rp-image = { path = "../../boot/image" }
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-hal-mem = { path = "../../hal/mem" }
rp-drv-blit2d = { path = "../../drivers/blit2d" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-mbx3d = { path = "../../drivers/mbx3d" }
rp-mbx3d-render = { path = "../../drivers/mbx3d-render" }
rp-vram-map = { path = "../../drivers/vram-map" }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }

[lints]
workspace = true
