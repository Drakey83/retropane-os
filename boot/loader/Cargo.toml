[package]
name = "rp-loader"
description = "Resident loader (ADR-0012 U3, ADR-0013): receives images from the PC over USB serial (or the FFUART) and starts them; writes files to the SD card"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-udc = { path = "../../drivers/pxa-udc" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-mved = { path = "../../drivers/mved" }
rp-drv-cpld = { path = "../../drivers/cpld" }
rp-drv-sdcard = { path = "../../drivers/sdcard" }
rp-drv-pxa-mmc = { path = "../../drivers/pxa-mmc" }
rp-fat = { path = "../../kernel/fat" }
rp-usb-msc = { path = "../../drivers/usb-msc" }
rp-usb-mtp = { path = "../../drivers/usb-mtp", features = ["fat"] }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }
rp-drv-pxa-pwm = { path = "../../drivers/pxa-pwm" }
rp-drv-cf = { path = "../../drivers/cf" }
rp-loadproto = { path = "../loadproto" }
rp-crypto = { path = "../../kernel/crypto" }
rp-kernel-trace = { path = "../../kernel/trace" }

[lints]
workspace = true
