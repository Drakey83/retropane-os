[package]
name = "rp-mbx3d"
description = "Test image (ADR-0024 M4): the first triangle drawn by the 2700G's MBX 3D core, from the scene words Windows Mobile's own driver writes; finds the tile size and the completion signal, read back and shown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-hal-mem = { path = "../../hal/mem" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-blit2d = { path = "../../drivers/blit2d" }
rp-drv-mbx3d = { path = "../../drivers/mbx3d" }
rp-drv-pxa-keypad = { path = "../../drivers/pxa-keypad" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }

[dependencies]
rp-drv-mbx3d = { path = "../../drivers/mbx3d" }

[lints]
workspace = true
