[package]
name = "rp-tone"
description = "Audio check for the real X51v: the WM8750 found on I2C, a sine streamed through I2S by DMA to the speaker, then to the headphones once they're plugged in"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-pxa-gpio = { path = "../../drivers/pxa-gpio" }
rp-drv-pxa-i2c = { path = "../../drivers/pxa-i2c" }
rp-drv-pxa-i2s = { path = "../../drivers/pxa-i2s" }
rp-drv-wm8750 = { path = "../../drivers/wm8750" }
rp-drv-cpld = { path = "../../drivers/cpld" }

[lints]
workspace = true
