[package]
name = "rp-light"
description = "First-light image for the real X51v: paints the whole screen a colour per startup step, so a hang shows where it stopped"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "none")'.dependencies]
rp-image = { path = "../../boot/image" }
rp-hal-api = { path = "../../hal/api" }
rp-hal-pxa27x = { path = "../../hal/pxa27x" }
rp-hal-x51v = { path = "../../hal/x51v" }
rp-drv-pxa-uart = { path = "../../drivers/pxa-uart" }
rp-drv-mbx-display = { path = "../../drivers/mbx-display" }
rp-drv-cpld = { path = "../../drivers/cpld" }

[lints]
workspace = true
