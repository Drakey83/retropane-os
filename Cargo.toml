[workspace]
resolver = "3"
members = [
    "hal/api",
    "hal/mock",
    "hal/pxa27x",
    "hal/x51v",
    "hal/mem",
    "hal/user",
    "drivers/pxa-uart",
    "drivers/mbx-display",
    "drivers/blit2d",
    "drivers/mbx-render",
    "drivers/mbx3d",
    "drivers/mbx3d-render",
    "drivers/vram-map",
    "drivers/cpld",
    "drivers/gfx",
    "drivers/draw",
    "drivers/pxa-keypad",
    "drivers/pxa-gpio",
    "drivers/pxa-ssp",
    "drivers/tsc2046",
    "drivers/touch-cal",
    "drivers/sdcard",
    "drivers/pxa-mmc",
    "drivers/pxa-udc",
    "drivers/usb-msc",
    "drivers/pxa-pwm",
    "drivers/cf",
    "drivers/pxa-i2c",
    "drivers/pxa-i2s",
    "drivers/wm8750",
    "kernel/mm",
    "kernel/pe",
    "kernel/lz4",
    "kernel/sched",
    "kernel/fat",
    "kernel/crypto",
    "kernel/ipc",
    "kernel/trace",
    "boot/hello",
    "boot/light",
    "boot/handover",
    "boot/nightlight",
    "boot/crash",
    "boot/hang",
    "boot/mbx",
    "boot/mbx-blend",
    "boot/mbx3d",
    "boot/mbx3d-api",
    "boot/cftime",
    "boot/sdtime",
    "boot/storfast",
    "boot/picture",
    "boot/blend",
    "boot/cs3bus",
    "boot/usb",
    "boot/reconnect",
    "boot/loadproto",
    "boot/loader",
    "boot/bench",
    "boot/suite",
    "boot/probe",
    "boot/kernel",
    "boot/threads",
    "boot/quantum",
    "services/display-host",
    "services/graphics",
    "shell/core",
    "shell/today",
    "personality/ce/cab",
    "personality/ce/setup",
    "tools/romdump",
    "tools/apiscan",
    "pc/legacysync",
    "xtask",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "GPL-2.0-or-later"
repository = "https://github.com/Drakey83/retropane-os"
publish = false

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = true

[profile.dev]
panic = "abort"

# ADR-0005 rule 8: cold code is built for size. The bring-up image runs once;
# hot paths (hal/mem, display fills) keep opt-level 3 in their own crates.
[profile.release.package.rp-hello]
opt-level = "s"
[profile.release.package.rp-drv-sdcard]
opt-level = "s"
[profile.release.package.rp-drv-pxa-mmc]
opt-level = "s"
[profile.release.package.rp-fat]
opt-level = "s"
[profile.release.package.rp-usb-msc]
opt-level = "s"
[profile.release.package.rp-drv-cpld]
opt-level = "s"
[profile.release.package.rp-probe]
opt-level = "s"
# Driver hosts are cold code: calls and button presses (ADR-0005 rule 8).
[profile.release.package.rp-display-host]
opt-level = "s"
# The loader is cold code too (it waits on the PC); the generic drivers and
# file systems it links are compiled here, in its crate, so this is what
# builds them for size. Its hot paths (memcpy, the FIFOs' DMA) don't depend
# on it.
[profile.release.package.rp-loader]
opt-level = "s"
# The kernel image's own crate is bring-up and test-harness code (cold); the
# kernel libraries it links (kernel/mm, kernel/lz4) keep opt-level 3.
[profile.release.package.rp-kernel]
opt-level = "s"
[profile.release.package.rp-threads]
opt-level = "s"
[profile.release.package.rp-quantum]
opt-level = "s"
# IPC bookkeeping: table scans unrolled at opt-level 3 cost ~2 KB for no
# measurable gain (the call path is a few loads and compares).
[profile.release.package.rp-kernel-ipc]
opt-level = "s"
# Image loading runs once per page per image (cold, ADR-0005 rule 8).
[profile.release.package.rp-kernel-pe]
opt-level = "s"
