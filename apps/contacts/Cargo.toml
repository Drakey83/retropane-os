[package]
name = "rp-app-contacts"
description = "Contacts, version 2 (docs/design/contacts-rule0.md): favourites grid, avatars with initials, the card with its action row, phone numbers formatted as typed, address suggestions; an app program (rp-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-app = { path = "../api" }
rp-pim = { path = "../../shell/pim" }
# Its state made straight into its slot (`in_place!`, the stack rule).
rp-hal-mem = { path = "../../hal/mem" }

# The program's runtime (entry, panic) only in the device build.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-user = { path = "../../hal/user", features = ["app"] }

[dev-dependencies]
rp-draw = { path = "../../drivers/draw" }

[lints]
workspace = true
