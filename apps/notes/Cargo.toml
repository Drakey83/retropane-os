[package]
name = "rp-app-notes"
description = "Notes, version 2 (docs/design/notes-rule0.md): a grid of cards with ink miniatures, notes made of text, checklist and ink blocks on ruled paper, smooth ink; an app program (rp-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-app = { path = "../api" }
rp-pim = { path = "../../shell/pim" }

# The program's runtime (entry, panic) only in the device build.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-user = { path = "../../hal/user", features = ["app"] }

[lints]
workspace = true
