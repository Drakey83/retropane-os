[package]
name = "rp-app-calculator"
description = "Calculator, version 2 (docs/design/calculator-rule0.md): the live sum and tape, memory keys, scientific keys, units, money, tip and split, dates; an app program (rp-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-app = { path = "../api" }

# The program's runtime (entry, panic) only in the device build.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-user = { path = "../../hal/user", features = ["app"] }

[lints]
workspace = true
