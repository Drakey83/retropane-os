[package]
name = "rp-app-tasks"
description = "Tasks, version 2 (docs/design/tasks-rule0.md): smart tiles with counts, coloured lists with progress, the round tick, flags, the highlighted add line; an app program (rp-app)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
rp-app = { path = "../api" }
rp-pim = { path = "../../shell/pim" }

# The program's runtime (entry, panic) only in the device build.
[target.'cfg(target_os = "none")'.dependencies]
rp-hal-user = { path = "../../hal/user", features = ["app"] }

[lints]
workspace = true
